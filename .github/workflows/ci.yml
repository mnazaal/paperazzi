name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 05:00 UTC. Drives both `unlocked` (fresh dependency
    # resolution) and `live` (real third-party network calls) below — jobs
    # that ask a question about the outside world rather than about the
    # commit, so neither gates a merge and neither runs on every push.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install package and dev tools
        # `--locked`, not `--frozen`: `--frozen` installs a lock that is out of
        # step with `pyproject.toml` silently, so CI would go green against a
        # dependency set the release will not use.
        run: uv sync --locked --extra dev

      - name: Ruff
        run: .venv/bin/ruff check src tools tests

      - name: Pyright
        run: .venv/bin/pyright

      - name: Tests with coverage (excluding browser tests)
        env:
          PZI_SKIP_AUTO_START: "1"
        run: .venv/bin/pytest -m "not browser" --cov=pzi --cov-report=term-missing --cov-report=xml -q

      - name: Build browser extension
        run: .venv/bin/python tools/build_extension.py

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-24.04'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Build package
        run: .venv/bin/python -m build

      - name: Check package metadata (twine)
        run: .venv/bin/twine check dist/*.tar.gz dist/*.whl

      - name: Smoke-test wheel install
        run: |
          python -m venv /tmp/pzi-wheel-smoke
          /tmp/pzi-wheel-smoke/bin/pip install dist/*.whl
          /tmp/pzi-wheel-smoke/bin/pzi --version
          /tmp/pzi-wheel-smoke/bin/python -c "import pzi; print(pzi.__version__)"

  playwright:
    name: Playwright browser tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install package with dev tools (includes playwright)
        # `uv sync --locked`, matching the other two jobs. This one resolved
        # fresh on every run, which is exactly what the comment on the lint job
        # explains is unacceptable — and this job gates the release, so an
        # unlocked resolution here could keep the browser suite green against a
        # dependency set the release will not use.
        run: uv sync --locked --extra dev

      - name: Install Playwright browsers
        run: .venv/bin/playwright install chromium firefox

      - name: Browser tests
        env:
          PZI_SKIP_AUTO_START: "1"
        run: .venv/bin/pytest -m "browser" -v

  live:
    name: Live network smoke (non-gating)
    runs-on: ubuntu-24.04
    # Network-dependent metadata paths (Crossref/OpenAlex/S2/Unpaywall) are not
    # exercised by the gating suite. Run them separately and never block a merge
    # on third-party flakiness — regressions still show up as a failed check.
    # Weekly and on-demand only: real provider calls have no business running
    # on every push, so this does not use the `push`/`pull_request` triggers
    # above.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install package and dev tools
        # `--locked`, not `--frozen`: `--frozen` installs a lock that is out of
        # step with `pyproject.toml` silently, so CI would go green against a
        # dependency set the release will not use.
        run: uv sync --locked --extra dev

      - name: Live smoke tests
        env:
          PZI_LIVE: "1"
          PZI_CONTACT_EMAIL: "18580527+mnazaal@users.noreply.github.com"
        run: .venv/bin/pytest tests/live/ -m "not browser" -q

  unlocked:
    name: Fresh resolution (no lockfile)
    # Every other job installs with `uv sync --locked`, so nothing in CI has
    # ever run against the dependency set a `pip install` produces. That gap is
    # not hypothetical: bibtexparser 2.0.0b10 flipped a default pzi depended on,
    # and the tests that would have caught it already existed — they had simply
    # never been run against b10.
    #
    # Weekly, and never blocking. A failure here is news about someone else's
    # release, not about the commit under test; wiring it to `push` would let an
    # upstream publication turn every PR red, which is how a job like this gets
    # ignored and then deleted.
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Resolve from pyproject.toml, ignoring the lockfile
        run: |
          rm -f uv.lock
          uv sync --extra dev

      - name: Report drift from the lockfile
        # The job's own exit condition. If the fresh resolution matches the
        # lockfile, this run tested the same versions as every other job and
        # proved nothing — say so rather than reporting a green that means
        # nothing.
        run: |
          git --no-pager diff --stat -- uv.lock
          if git diff --quiet -- uv.lock; then
            echo "::warning::fresh resolution matches uv.lock; this run duplicated the locked jobs"
          fi

      - name: Tests (excluding browser tests)
        env:
          PZI_SKIP_AUTO_START: "1"
        run: .venv/bin/pytest -m "not browser" -q
