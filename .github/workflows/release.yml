name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# One release run per tag. A re-pushed tag or a manual re-run would otherwise
# race the previous run through `gh release create`, and both would try to
# upload the same asset names.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # A `v*` tag used to publish whatever it pointed at: no tests, and no check
    # that the tag, `pyproject.toml`'s version and the changelog agreed. A
    # mistyped tag shipped a release named after a version that did not exist.
    name: Verify tag, version and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        # Without this the 52 browser-extension tests skip silently inside the
        # gating `-m 'not browser'` run — they are marked `skipif(node is None)`
        # — so the release gate passed while running none of them. They pass
        # today only because the runner image happens to ship Node.
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Check tag matches the project version and changelog
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          project_version=$(python -c "
          import tomllib
          print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])
          ")
          if [ "$version" != "$project_version" ]; then
            echo "tag $tag does not match pyproject version $project_version" >&2
            exit 1
          fi

      - name: Install locked dependencies
        # `--locked`, not `--frozen`. Both install exactly what `uv.lock` pins,
        # but only `--locked` *verifies* the lock is up to date with
        # `pyproject.toml` — `--frozen` skips resolution entirely and would
        # happily release from a lockfile that no longer matches the manifest,
        # which is the one thing this step exists to rule out.
        run: uv sync --locked --all-extras

      - name: Install Playwright browsers
        run: uv run --locked playwright install chromium firefox

      - name: Run tests
        # Same env as `ci.yml` and as the browser step below: without it this
        # run may reach for a real translation server.
        env:
          PZI_SKIP_AUTO_START: "1"
        run: uv run --locked pytest -m 'not browser' -q

      - name: Browser tests
        # The browser suite gates the release too. It ran only in CI, so a red
        # browser suite on the release branch could not stop a tag.
        env:
          PZI_SKIP_AUTO_START: "1"
        run: uv run --locked pytest -m browser -q

      - name: Lint
        run: uv run --locked ruff check src tools tests

      - name: Pyright
        # `ci.yml` runs this and the release path did not, so a type regression
        # could redden CI and still not stop a tag.
        run: uv run --locked pyright

  build:
    name: Build sdist + wheel
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install build tools
        run: |
          uv venv .venv
          uv pip install build twine

      - name: Build package
        run: .venv/bin/python -m build

      - name: Check package metadata (twine)
        run: .venv/bin/twine check dist/*.tar.gz dist/*.whl

      - name: Build browser extension zips
        run: python tools/build_extension.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags: the release body is now built from
          # `git log <previous-tag>..<tag>`, and checkout's default shallow
          # clone has neither, so `git describe --tags` would find nothing and
          # the range would be empty — an empty release body, not an error.
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          # Release notes are the commit subjects since the previous tag.
          # `CHANGELOG.md` was closed after 0.2.0 — it had no external reader
          # and drifted from the code — so `git log` is the record, and the
          # gate that used to require a section for $version is gone with it.
          # `--no-merges` because a merge subject names a branch, not a change.
          previous=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="${previous}..${tag}"
          else
            range="$tag"
          fi
          body=$(printf '## %s\n\n%s\n' "$version" \
            "$(git log --no-merges --format='- %s' "$range")")
          # A version carrying a PEP 440 pre-release segment is not "Latest".
          # Marking a beta as the latest release tells every visitor — and any
          # tool reading /releases/latest — that it is the recommended one.
          # Paired with the README pointing at the releases *list* rather than
          # /releases/latest, which skips pre-releases and walks back to the
          # newest release without that flag — for this repo, a beta from
          # before the flag was applied. It resolves, and to the wrong thing.
          prerelease=""
          if printf '%s' "$version" | grep -Eq '(a|b|rc)[0-9]+$'; then
            prerelease="--prerelease"
          fi
          # Idempotent: a re-run must not fail because the release exists, and
          # must not silently skip the assets either.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes "$body" $prerelease
            gh release upload "$tag" \
              dist/*.tar.gz dist/*.whl dist/*.zip --clobber
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes "$body" \
              $prerelease \
              dist/*.tar.gz dist/*.whl dist/*.zip
          fi
    permissions:
      contents: write

  # --- PyPI publishing (dormant) ---
  # paperazzi is not yet on PyPI. This job is wired for trusted publishing but is
  # disabled until the PyPI project is registered. To enable:
  #   1. Register the 'paperazzi' project on PyPI.
  #   2. Configure a PyPI trusted publisher for this repo (PyPI web UI).
  #   3. Set the repo variable PYPI_ENABLED to 'true' (repo Settings →
  #      Secrets and variables → Actions → Variables).
  pypi:
    name: Publish to PyPI (dormant)
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/paperazzi
    if: vars.PYPI_ENABLED == 'true'
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Collect distributions
        # `dist/` also holds the extension zips, which PyPI must never see —
        # the default `packages-dir` would hand it every file in the directory.
        run: |
          mkdir -p dist-pypi
          cp dist/*.tar.gz dist/*.whl dist-pypi/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi
