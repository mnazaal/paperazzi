translation_server_url = "http://127.0.0.1:1969"
api_listen_host = "127.0.0.1"
api_listen_port = 8765
# Localhost API hardening. `pzi init` writes a token to <data-home>/api_token
# (0600) and pzi auto-reads it there at runtime, so you normally set nothing
# here and this file stays secret-free. To override, in precedence order:
# api_auth_token_cmd = "pass show pzi-token"   # stdout is the token; runs without a shell
# api_auth_token = "change-me-long-random-token"  # plaintext fallback (avoid committing)
# api_allowed_origins = ["http://127.0.0.1", "http://localhost", "chrome-extension://", "moz-extension://"]
# api_max_body_bytes = 67108864  # allows browser extension PDF byte uploads
# Prefer _cmd values for secrets/identity stored in a password manager, but plaintext is supported.
# contact_email_cmd = "pass show research-email" # identifies you to Crossref/OpenAlex; used as Unpaywall fallback
# contact_email = "your@email.com"
# unpaywall_email_cmd = "pass show unpaywall-email" # optional override for Unpaywall OA PDF lookup
# unpaywall_email = "your@email.com"
# semantic_scholar_api_key_cmd = "pass show semantic-scholar" # Semantic Scholar API key
# semantic_scholar_api_key = "..."          # plaintext alternative to the _cmd form above

# Optional Zotero/Better BibTeX-style naming templates.
# citekey_format supports a subset of the Better BibTeX formula language:
#   auth, title, shorttitle(n, m), year, doi, venue, and any other bib field,
#   with the .lower / .upper / .fold / .clean filters, plus quoted literals.
#   shorttitle(n, m) = first n title words (Better BibTeX's skipWords dropped),
#   the first m of them capitalized; m defaults to 0, meaning none.
# Quoted literals may contribute the separators - _ : . so a library exported
# from Better BibTeX can be matched key-for-key, e.g.
#   citekey_format = 'auth.lower + "-" + shorttitle(1, 0).lower + "-" + year'
# yields smith-graph-2024. Known deviation: on a collision pzi appends -2, -3
# where Better BibTeX appends a, b.
# citekey_format = "auth.lower + shorttitle(3,3) + year"
# pdf_filename_format = "{{ firstCreator suffix=\" - \" }}{{ year suffix=\" - \" }}{{ title truncate=\"100\" }}"
# pdf_filename_format takes Zotero 7 file-renaming templates; the line above is
#   Zotero's own default. firstCreator is the Creator column -- one name alone,
#   two joined by "and", three or more as "et al." -- while auth stays Better
#   BibTeX's single surname, so the two differ on purpose. Options: prefix,
#   suffix, start, truncate, case, match, replaceFrom/replaceTo, and regexOpts
#   ("i" to ignore case, "g" to replace every match). Capture groups may be
#   written Zotero's way ($1) or Python's (\1).
# pzi addition: a second replaceFrom2/replaceTo2 pair, applied after the first.
#   It exists for the case Zotero's single pair cannot express -- reducing
#   "Smith and Doe" to "Smith-Doe" while also dropping the period from
#   "Smith et al.". A library already renamed by Zotero with hyphen separators
#   is matched file-for-file by (note the single quotes: TOML would eat the
#   backslashes in a "..." string)
#   pdf_filename_format = '{{ firstCreator suffix="-" replaceFrom="\s+and\s+" replaceTo="-" replaceFrom2="\.$" replaceTo2="" }}{{ year suffix="-" }}{{ title truncate="100" }}'
#   yielding Chow-Tsitsiklis-1989-Title.pdf and Blondel et al-2001-Title.pdf.
# PDF file fields default to absolute paths. Set "relative" to write paths relative to the .bib file.
# pdf_file_path_style = "absolute"  # "absolute" or "relative"
# Optional external page processor: reads {url, html, metadata} JSON from stdin; writes metadata JSON.
# page_metadata_cmd = "paper-meta --json"
# page_metadata_timeout_seconds = 5

# PDF download options. The chain is: direct → persistent server browser →
# browser_pdf_cmd → FlareSolverr → desktop browser + Downloads watcher.
# Browser hook uses your browser profile for authenticated institutional access.
# pzi init --setup writes the full command; change the path (or --browser) here.
# Firefox: ~/.mozilla/firefox/xxx.default-release
# Chrome:  ~/.config/google-chrome/Default
# Chromium: ~/.config/chromium
# browser_pdf_cmd = "... -m pzi.browser_pdf_hook --profile ~/.mozilla/firefox/xxx.default-release --browser firefox"
# browser_hook = true  # false skips the *headless* stages (persistent server browser and
#                      # browser_pdf_cmd) in headless/server envs. It does NOT control the
#                      # desktop-browser fallback — that is PZI_DISABLE_DESKTOP_BROWSER_FALLBACK.

# FlareSolverr bypasses Cloudflare (gray area — may violate publisher ToS)
# flaresolverr_url = "http://127.0.0.1:8191"

# Cache dir for Node.js + translation-server. Defaults to $XDG_DATA_HOME/pzi
# (i.e. ~/.local/share/pzi when XDG_DATA_HOME is unset). Set to override.
# pzi_data_home = "~/.local/share/pzi"

# Explicit Node.js >= 22 binary for the translation-server. Set this to use a
# Node you already manage (fnm/nvm/volta/asdf, a system install, …) instead of
# letting pzi auto-detect PATH or download a portable build. Absolute path or a
# command name on PATH. The PZI_NODE env var overrides this. A set-but-broken
# value is a hard error, not a silent fallback. Useful under systemd/daemons,
# whose PATH does not include your shell's version-manager shims.
# node_path = "/home/you/.local/share/fnm/node-versions/v22.10.0/installation/bin/node"

# Persistent browser session (server-mode; used by CLI when server is reachable).
# browser_profile_path = "~/.config/google-chrome/Default"  # browser profile for auth/session
# browser_engine = "chromium"  # chromium, firefox, or webkit
# api_url = "http://127.0.0.1:8765"  # override auto-derived server URL
# Desktop browser fallback for preprint hosts that block headless browsers.
# desktop_fallback_hosts = ["biorxiv.org", "medrxiv.org", "researchsquare.com", "ssrn.com", "authorea.com"]

# ezproxy_host = "proxy.lib.university.edu"  # route PDF downloads through institutional EZProxy
# (bare hostname; this host is trusted and may resolve to a private/campus IP — see
# https://github.com/mnazaal/paperazzi/blob/main/docs/security.md)

# Metadata confidence tuning
# promote_confidence_threshold = 60  # min 0-100 match score to promote a preprint → published (default 60)
# promote_recheck_after_days = 30  # days before --promote re-asks about a preprint that
# answered "not published yet" (default 30). Those answers are kept in
# <pzi_data_home>/promote-checked.json so a periodic sweep does not redo the whole
# search every run; 0 disables the ledger entirely and re-checks everything.
# metadata_confidence_min_score = 0  # 0-100; default 0 (off)
# `add` warns when the selected candidate scores below this. `update` does not
# warn — it *refuses* the entry, leaving it unchanged and reporting it as
# skipped, so raising this above 0 makes `update` write less, not just say more.
# metadata_cache_ttl = 0             # cache metadata-API responses on disk for N seconds (0 = off)
# pdf_discovery_parallel = false     # run the PDF discovery fallback chain in parallel

# Directories `POST /capture` may ingest a local PDF from. Empty (the default)
# refuses local-file capture over HTTP entirely; the browser extension only ever
# sends http(s) URLs, so leave this unset unless you script local ingests.
# capture_source_dirs = ["~/Downloads/papers"]

# The only file `POST /inbox/drain` may read and rewrite. Unset (the default)
# closes that route. Draining rewrites the file in place.
# inbox_path = "~/pzi-inbox.txt"

[[bibs]]
name = "main"
path = "~/bibs/main.bib"
default = true
# papers_dir = "~/bibs/papers"  # defaults to <bib-dir>/papers/

